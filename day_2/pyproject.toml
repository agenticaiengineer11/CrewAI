[project]
name = "crewai-product-research"
version = "0.1.0"
description = "Professional CrewAI product research system"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "crewai",
    "litellm",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/product_research"]