decision_task:
  description: >
    Evaluate the research findings, competitor analysis, and
    market summary for {product_name}.

    Determine:
    1. The overall competition level: low, medium, or high.
    2. Market potential on a scale from 0 to 10.
    3. Whether the product should be launched, tested further,
       or rejected.
    4. The major risks and uncertainties.
    5. The evidence supporting your recommendation.

    Do not invent facts. Clearly identify missing information
    and uncertainties.
  expected_output: >
    A structured product decision containing the product name,
    competition level, market potential score, recommendation,
    and a list of key risks.
research_task:
  description: >
    Research the product "{product_name}".

    First, use the E-commerce Product Search tool to
    retrieve basic information about the product.

    After obtaining the product information, use the
    Product Price Lookup tool to obtain pricing information.

    Then analyze the information returned by both tools.

    Do not invent product specifications or prices.
    Clearly identify any information that could not be verified.

  expected_output: >
    A structured product research report containing:
    1. Product overview
    2. Main features
    3. Price information
    4. Target customers
    5. Common use cases
    6. Verified facts
    7. Information gaps and assumptions

competitor_task:
  description: >
    Analyze competitors relevant to "{product_name}".

    Use the product research report provided as context.
    Identify relevant competing products, compare their
    features and positioning, and explain their
    differentiators.

    If reliable competitor information is unavailable,
    state that clearly instead of inventing details.

  expected_output: >
    A structured competitor analysis report containing:
    1. Product being analyzed
    2. Relevant competitors
    3. Feature comparison
    4. Competitor positioning
    5. Key differentiators
    6. Information gaps and assumptions
market_summary_task:
  description: >
    Conduct market research for "{product_name}".

    Identify market trends, customer preferences,
    and potential opportunities.

    Provide a clear summary of the market landscape,
    including relevant statistics and insights.

    Do not invent statistics or market data.
    Clearly identify the source or state when reliable
    data is unavailable.

  expected_output: >
    A structured market research summary containing:
    1. Market trends
    2. Customer preferences
    3. Potential opportunities
    4. Relevant statistics and insights
    5. Information sources
    6. Information gaps and assumptions