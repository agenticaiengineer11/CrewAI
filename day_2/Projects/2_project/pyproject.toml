
[project]
name = "product-research-api"
version = "0.1.0"
description = "CrewAI Product Research Flow with FastAPI"
requires-python = ">=3.11,<3.13"
dependencies = [
    "crewai",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "pydantic",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
